<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kinematic & Aerodynamic Trajectory Lab</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <header>
        <h1>KinematicLab</h1>
        <p class="subtitle">2D Newtonian Mechanics & Aerodynamics Simulator</p>
      </header>

      <section class="control-group">
        <label for="planet-select">Environment Preset</label>
        <select id="planet-select">
          <option value="9.81,1.225" selected>Earth (g = 9.81 m/s², ρ = 1.225 kg/m³)</option>
          <option value="1.62,0.0">Moon (g = 1.62 m/s², Vacuum)</option>
          <option value="3.72,0.020">Mars (g = 3.72 m/s², ρ = 0.020 kg/m³)</option>
          <option value="24.79,0.0">Jupiter (g = 24.79 m/s², Vacuum)</option>
          <option value="custom">Custom Parameters</option>
        </select>
      </section>

      <section class="control-group">
        <label>Initial Velocity ($v_0$): <span id="v0-val">45</span> m/s</label>
        <input type="range" id="v0" min="5" max="120" value="45" step="1">
      </section>

      <section class="control-group">
        <label>Launch Angle ($\theta$): <span id="angle-val">45</span>°</label>
        <input type="range" id="angle" min="0" max="90" value="45" step="1">
      </section>

      <section class="control-group">
        <label>Initial Height ($y_0$): <span id="y0-val">0</span> m</label>
        <input type="range" id="y0" min="0" max="100" value="0" step="1">
      </section>

      <section class="control-group">
        <label>Projectile Mass ($m$): <span id="mass-val">5.0</span> kg</label>
        <input type="range" id="mass" min="0.1" max="50" value="5.0" step="0.1">
      </section>

      <section class="control-group">
        <label>Drag Coefficient ($C_d$): <span id="cd-val">0.47</span></label>
        <input type="range" id="cd" min="0.0" max="1.5" value="0.47" step="0.01">
      </section>

      <section class="control-group">
        <label>Cross-Section Area ($A$): <span id="area-val">0.05</span> m²</label>
        <input type="range" id="area" min="0.001" max="0.5" value="0.05" step="0.005">
      </section>

      <div class="button-row">
        <button id="launch-btn" class="primary">Launch</button>
        <button id="reset-btn" class="secondary">Clear Trails</button>
      </div>

      <section class="telemetry">
        <h3>Live Telemetry</h3>
        <div class="metric-grid">
          <div class="metric"><span>Time ($t$):</span> <strong id="t-metric">0.00 s</strong></div>
          <div class="metric"><span>Velocity ($v$):</span> <strong id="v-metric">0.00 m/s</strong></div>
          <div class="metric"><span>Max Height ($H$):</span> <strong id="h-metric">0.00 m</strong></div>
          <div class="metric"><span>Total Range ($R$):</span> <strong id="r-metric">0.00 m</strong></div>
          <div class="metric"><span>Kinetic ($E_k$):</span> <strong id="ke-metric">0 J</strong></div>
          <div class="metric"><span>Potential ($E_p$):</span> <strong id="pe-metric">0 J</strong></div>
        </div>
      </section>
    </aside>

    <main class="canvas-wrapper">
      <canvas id="simCanvas"></canvas>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
